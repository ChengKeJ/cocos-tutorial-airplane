name: Build WeChat Mini Game

# Builds the Cocos Creator 3.8.8 project (airplane/) for the WeChat Mini Game
# platform on a GitHub-hosted macOS runner and uploads the wechatgame output
# as an artifact. No secrets are needed: the build is fully offline and the
# AppID is the public mini-game AppID (wx259411cbfcbbaa3f).
#
# Cocos Creator has no Linux editor, so this runs on macOS. The editor is
# downloaded once from the official Cocos CDN and cached between runs.
# The binary SHA-256 is pinned (same value as the dantech0xff/pencil-blade-2026
# reference project, which runs Creator 3.8.8 on a self-hosted macOS runner).
#
# Creator exit codes: 36 = build succeeded, 32 = bad build parameters,
# 34 = build failure.

on:
  push:
    branches: [master]
    paths:
      - 'airplane/**'
      - '.github/workflows/build-wechat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wechat:
    name: Build wechatgame (Cocos Creator 3.8.8)
    # NOTE: macos-14 was retired by GitHub on 2026-11-02 (actions/runner-images);
    # any job naming it is cancelled instantly with "The configuration
    # 'macos-14-arm64-us-default' is not supported" (run 44015841102).
    # macos-15 is the pinned replacement (macos-latest currently = macos-26).
    runs-on: macos-15
    timeout-minutes: 60

    env:
      # NOTE: the `runner` context is NOT available in job-level `env`
      # (GitHub rejects the whole workflow file at load time if it is used
      # there — run 44015193564 failed instantly with zero jobs for exactly
      # this reason). Creator paths are set from $RUNNER_TEMP inside the
      # `run:` scripts that need them instead.
      COCOS_CREATOR_BIN_SHA256: 3a8452496c03e85f2784e64679a1fd203701b0b245125efee02c7923f2bd3464
      COCOS_CREATOR_ZIP_URL: https://download.cocos.com/CocosCreator/v3.8.8/CocosCreator-v3.8.8-mac-121518.zip
      WECHAT_BUILD_DIR: airplane/build/wechatgame

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cocos Creator 3.8.8
        id: creator-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/Cocos/Creator/3.8.8
          key: cocos-creator-3.8.8-macos-15

      - name: Install Cocos Creator 3.8.8
        if: steps.creator-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/Cocos/Creator"
          cd "${{ runner.temp }}"
          curl -fsSL -o cocos-creator-3.8.8.zip "$COCOS_CREATOR_ZIP_URL"
          mkdir -p cocos-creator-extract
          ditto -xk cocos-creator-3.8.8.zip cocos-creator-extract
          # The zip contains CocosCreator.app at its top level.
          test -d cocos-creator-extract/CocosCreator.app
          mv cocos-creator-extract/CocosCreator.app Cocos/Creator/3.8.8/CocosCreator.app
          rm -rf cocos-creator-extract cocos-creator-3.8.8.zip
          # Strip the download quarantine flag so Gatekeeper does not block the CLI.
          xattr -cr Cocos/Creator/3.8.8/CocosCreator.app || true

      - name: Verify Creator 3.8.8 binary
        shell: bash
        run: |
          set -euo pipefail
          COCOS_CREATOR_APP="$RUNNER_TEMP/Cocos/Creator/3.8.8/CocosCreator.app"
          COCOS_CREATOR_BIN="$RUNNER_TEMP/Cocos/Creator/3.8.8/CocosCreator.app/Contents/MacOS/CocosCreator"
          test -x "$COCOS_CREATOR_BIN"
          creator_version=$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$COCOS_CREATOR_APP/Contents/Info.plist")
          test "$creator_version" = "3.8.8"
          creator_sha256=$(/usr/bin/shasum -a 256 "$COCOS_CREATOR_BIN" | /usr/bin/cut -d ' ' -f 1)
          test "$creator_sha256" = "$COCOS_CREATOR_BIN_SHA256"
          printf 'Cocos Creator %s verified (sha256 %s)\n' "$creator_version" "$creator_sha256"

      - name: Build wechatgame
        shell: bash
        run: |
          set +e
          COCOS_CREATOR_BIN="$RUNNER_TEMP/Cocos/Creator/3.8.8/CocosCreator.app/Contents/MacOS/CocosCreator"
          "$COCOS_CREATOR_BIN" \
            --project "$GITHUB_WORKSPACE/airplane" \
            --build "stage=build;configPath=$GITHUB_WORKSPACE/airplane/build-configs/wechatgame.json;"
          creator_status=$?
          set -e
          case "$creator_status" in
            36)
              printf 'Cocos Creator wechatgame build succeeded (exit 36).\n'
              ;;
            32)
              printf 'Cocos Creator rejected the build parameters (exit 32).\n' >&2
              exit 32
              ;;
            34)
              printf 'Cocos Creator reported a build failure (exit 34).\n' >&2
              exit 34
              ;;
            *)
              printf 'Unexpected Cocos Creator exit code: %s\n' "$creator_status" >&2
              exit 1
              ;;
          esac

      - name: Report build size
        shell: bash
        run: |
          set -euo pipefail
          test -d "$WECHAT_BUILD_DIR"
          test -f "$WECHAT_BUILD_DIR/game.json"
          test -f "$WECHAT_BUILD_DIR/project.config.json"
          printf 'WeChat build files:\n'
          find "$WECHAT_BUILD_DIR" -type f | sort
          total_bytes=$(find "$WECHAT_BUILD_DIR" -type f -exec stat -f %z {} + | awk '{s+=$1} END {print s}')
          printf 'Total build size: %s bytes (%.2f MB)\n' "$total_bytes" "$(python3 -c "print($total_bytes/1024/1024)")"
          printf 'Main-package limit for WeChat mini games is 4 MB (engine is separated, see separateEngine).\n'
          if [ "$total_bytes" -gt 20971520 ]; then
            printf 'Build exceeds the 20 MB total package limit.\n' >&2
            exit 1
          fi

      - name: Upload wechatgame artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wechatgame-${{ github.run_id }}-${{ github.run_attempt }}
          path: airplane/build/wechatgame
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
